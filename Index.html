<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Método Oculto - Oficial</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">

<script src="https://player.vimeo.com/api/player.js"></script>

<style>
body {
  margin: 0;
  background: #030712;
  font-family: 'Poppins', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  color: #fff;
}

.container {
  width: 100%;
  max-width: 900px;
}

.video-wrapper {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; 
  height: 0;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
}

.video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

#cta-section {
  display: none; 
  margin-top: 40px;
  text-align: center;
}

.timer {
  font-size: 40px;
  font-weight: 800;
  margin-bottom: 20px;
  color: #ef4444;
}

button {
  width: 100%;
  max-width: 400px;
  padding: 20px;
  font-size: 22px;
  font-weight: 800;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  background: linear-gradient(to right, #dc2626, #ef4444);
  color: white;
  transition: .3s;
  text-transform: uppercase;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
}

.status-msg {
  text-align: center;
  font-size: 14px;
  margin-top: 10px;
  color: #9ca3af;
}
</style>
</head>

<body>

<div class="container">

<h1 style="text-align:center; margin-bottom:20px; font-size: 1.8rem; color: #facc15;">
Assista ao vídeo para libertar o seu acesso!
</h1>

<div class="video-wrapper">
  <iframe 
    id="vimeo-player"
    src="https://player.vimeo.com/video/1172397566?badge=0&autopause=0" 
    allow="fullscreen" 
    allowfullscreen>
  </iframe>
</div>

<p id="info-text" class="status-msg">Clique no centro do player para iniciar a apresentação.</p>

<div id="cta-section">
  <div class="timer">
    <span id="minutes">10</span>:<span id="seconds">00</span>
  </div>

  <button onclick="window.location.href='https://pay.kiwify.com.br/Pefl40K'">
    ADQUIRA AGORA
  </button>

  <p style="margin-top:10px; color:#facc15; font-weight: bold;">
    ⏰ Oferta por tempo limitado!
  </p>
</div>

</div>

<script>
const iframe = document.querySelector('#vimeo-player');
const player = new Vimeo.Player(iframe);
const ctaSection = document.getElementById("cta-section");
const infoText = document.getElementById("info-text");

let timerIniciado = false;

function startCountdown() {
  if (timerIniciado) return;
  timerIniciado = true;
  
  let timeRemaining = 10 * 60; 
  const interval = setInterval(() => {
    timeRemaining--;
    let min = Math.floor(timeRemaining / 60);
    let sec = timeRemaining % 60;

    document.getElementById("minutes").textContent = min.toString().padStart(2, '0');
    document.getElementById("seconds").textContent = sec.toString().padStart(2, '0');

    if (timeRemaining <= 0) {
      clearInterval(interval);
      ctaSection.innerHTML = "<h2>⏰ Oferta Expirada</h2>";
    }
  }, 1000);
}

// Monitoriza o tempo do vídeo em tempo real
player.on('timeupdate', function(data) {
  // Se o vídeo chegar a 48 segundos (2s antes dos 50s)
  if (data.seconds >= 48) {
    ctaSection.style.display = "block";
    infoText.style.display = "none";
    startCountdown();
  }
});

// Garante o aparecimento se o utilizador saltar para o fim
player.on('ended', function() {
  ctaSection.style.display = "block";
  infoText.style.display = "none";
  startCountdown();
});
</script>

</body>
</html>
